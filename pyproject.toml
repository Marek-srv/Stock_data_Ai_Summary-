[project]
name = "graph-stock"
version = "0.27.0"
description = "Local NSE research OS — checkpointed, dependency-aware financial refresh"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3", "pypdf>=6.17,<7", "certifi>=2026.7.22", "langgraph>=1.2,<2", "langgraph-checkpoint-sqlite>=3.1,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
